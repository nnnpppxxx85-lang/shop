<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — DragonMobile</title>
  <meta name="description" content="Все категории электроники DragonMobile: iPhone, MacBook, iMac, AirPods, Apple Watch, Dyson и игровые консоли.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/cart.js"></script>
  <script defer src="assets/js/catalog.js"></script>
  <script defer src="assets/js/item.js"></script>
  <script defer src="assets/js/checkout.js"></script>
  <script defer src="assets/js/payment.js"></script>
  <script defer src="assets/js/contacts.js"></script>
  <script defer src="assets/js/admin.js"></script>
  <script defer src="assets/js/main.js"></script>
</head>
<body data-page="catalog">
  <div data-site-header></div>

  <main class="min-h-[70vh]">

    <!-- Заголовок каталога -->
    <section class="px-5 pb-12 pt-14 lg:px-8 lg:pb-16 lg:pt-20">
      <div class="mx-auto max-w-7xl">
        <p class="text-xs font-bold uppercase tracking-[.15em] text-forest">Все направления</p>
        <h1 class="mt-4 text-5xl font-extrabold sm:text-7xl">Каталог</h1>
        <p class="mt-5 max-w-xl text-base leading-7 text-subtle">
          Выберите категорию. Карточки товаров появятся после подключения каталога.
        </p>
      </div>
    </section>

    <!-- Поиск и фильтры -->
    <section class="px-5 pb-20 lg:px-8 lg:pb-28">
      <div class="mx-auto max-w-7xl">

        <div id="search" class="relative">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 text-subtle">⌕</span>
          <input
            data-category-search
            class="h-14 w-full rounded-full border border-line bg-paper pl-12 pr-5 text-sm outline-none transition focus:border-forest"
            type="search"
            placeholder="Найти категорию"
            aria-label="Найти категорию"
          >
        </div>

        <div data-filter-pills class="mt-5 flex gap-2 overflow-x-auto pb-2"></div>

        <div data-catalog-grid class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <!-- Toast-уведомление -->
  <div
    data-toast
    class="fixed bottom-5 left-1/2 z-50 flex -translate-x-1/2 translate-y-24 items-center gap-4 rounded-full bg-ink px-5 py-3 text-sm font-semibold text-paper opacity-0 transition"
  >
    <span>Корзина пока пуста</span>
    <button data-toast-close>×</button>
  </div>
</body>
</html>
