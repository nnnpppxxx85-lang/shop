<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — DragonMobile</title>
  <meta name="description" content="Контакты магазина электроники DragonMobile в Москве.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/cart.js"></script>
  <script defer src="assets/js/catalog.js"></script>
  <script defer src="assets/js/item.js"></script>
  <script defer src="assets/js/checkout.js"></script>
  <script defer src="assets/js/payment.js"></script>
  <script defer src="assets/js/contacts.js"></script>
  <script defer src="assets/js/admin.js"></script>
  <script defer src="assets/js/main.js"></script>
</head>

<body data-page="contacts">
  <div data-site-header></div>

  <main>

    <!-- ========== ЗАГОЛОВОК ========== -->
    <section class="px-5 pb-12 pt-14 lg:px-8 lg:pb-16 lg:pt-20">
      <div class="mx-auto max-w-7xl">
        <p class="text-xs font-bold uppercase tracking-[.15em] text-forest">
          На связи
        </p>

        <h1 class="mt-4 text-5xl font-extrabold sm:text-7xl">
          Контакты
        </h1>

        <p class="mt-5 max-w-lg text-base leading-7 text-subtle">
          Свяжитесь с нами, чтобы уточнить наличие, условия покупки или скидку для участников СВО.
        </p>
      </div>
    </section>

    <!-- ========== ФОРМА ОБРАТНОЙ СВЯЗИ ========== -->
    <section class="px-5 pb-20 lg:px-8 lg:pb-28">
      <div class="mx-auto max-w-xl">

        <form data-contact-form class="rounded-2xl border border-line bg-paper p-7 sm:p-10">
          <h2 class="text-2xl font-bold">Задать вопрос</h2>

          <div class="mt-8 grid gap-5">

            <label class="grid gap-2 text-sm font-semibold">
              Имя
              <input
                class="h-12 rounded-lg border border-line bg-canvas px-4 font-normal outline-none focus:border-forest"
                name="name"
                placeholder="Ваше имя"
                required
              >
            </label>

            <label class="grid gap-2 text-sm font-semibold">
              Телефон
              <input
                class="h-12 rounded-lg border border-line bg-canvas px-4 font-normal outline-none focus:border-forest"
                name="phone"
                type="tel"
                placeholder="+7 000 000-00-00"
                required
              >
            </label>

            <label class="grid gap-2 text-sm font-semibold">
              Сообщение
              <textarea
                class="min-h-28 rounded-lg border border-line bg-canvas p-4 font-normal outline-none focus:border-forest"
                name="message"
                placeholder="Чем можем помочь?"
              ></textarea>
            </label>

            <button
              class="h-12 rounded-full bg-forest px-6 text-sm font-bold text-paper transition hover:bg-forest-dark"
              type="submit"
            >
              Отправить
            </button>

            <p data-form-state class="text-xs text-subtle"></p>

          </div>
        </form>

      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <!-- ========== TOAST ========== -->
  <div
    data-toast
    class="fixed bottom-5 left-1/2 z-50 flex -translate-x-1/2 translate-y-24 items-center gap-4 rounded-full bg-ink px-5 py-3 text-sm font-semibold text-paper opacity-0 transition"
  >
    <span>Корзина пока пуста</span>
    <button data-toast-close>×</button>
  </div>
</body>
</html>
